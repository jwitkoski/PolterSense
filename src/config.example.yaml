# FICTIONAL demonstration building; this is not a real floor plan.
# PolterSense scene-only YAML. MQTT credentials are environment-only.
# Coordinates are absolute building-wide meters; z includes floor elevation.
# Floor membership is metadata, never a radio-coverage or motion-room guarantee.
schema_version: 1
name: Fictional Lantern House
map:
  flip_x: false
  flip_y: true
  wall_thickness: 0.1
  wall_color: "#64748b"
  wall_opacity: 0.5
floors:
  - id: ground
    name: Ground floor
    elevation: 0
    bounds: [[0, 0, 0], [8, 6, 3]]
    rooms:
      - id: studio
        name: Studio
        color: "#93c5fd"
        points: [[0, 0], [4, 0], [4, 6], [0, 6]]
      - id: kitchen
        name: Kitchen
        color: "#86efac"
        points: [[4, 0], [8, 0], [8, 6], [4, 6]]
  - id: upper
    name: Upper floor
    elevation: 3
    bounds: [[0, 0, 3], [8, 6, 6]]
    rooms:
      - id: loft
        name: Loft
        color: "#c4b5fd"
        points: [[0, 0], [8, 0], [8, 6], [0, 6]]
wisps:
  - id: wisp-studio
    name: Studio receiver
    # external_id deliberately omitted: no real firmware is connected.
    point: [1, 1, 1.5]
    floors: [ground]
  - id: wisp-loft
    name: Loft receiver
    point: [6, 4, 4.5]
    floors: [upper]
sources:
  - id: source-ground
    name: Demonstration ground radio
    ap_label: Fictional AP downstairs
    # radio_id, bssid and channel stay absent until actually known/configured.
    point: [4, 3, 2.5]
    floors: [ground]
  - id: source-upper
    name: Demonstration upper radio
    ap_label: Fictional AP upstairs
    point: [4, 3, 5.5]
    floors: [upper]
links:
  - id: link-studio
    name: Ground radio to studio receiver
    wisp_id: wisp-studio
    source_id: source-ground
  - id: link-loft
    name: Upper radio to loft receiver
    wisp_id: wisp-loft
    source_id: source-upper
